# Config propio del flavour WASM. Existe por una sola razón: `bindings.ts`.
#
# Todos los flavours de `ubrn` escriben en el directorio que diga `bindings.ts`, así que correr
# `build wasm2` con `ubrn.config.yaml` **pisa los bindings JSI** de `src/generated/` — el build de
# la app queda roto y el síntoma aparece lejos del comando que lo causó. Con este archivo, cada
# flavour escribe en el suyo y pueden convivir.
#
# `ts` apunta fuera de esta app, a `packages/core-financiero-wasm/generated`: el artefacto WASM
# vive donde vive su dueño (Task 4 de la Fase 5), no en `apps/react-native`, que antes lo generaba
# acá sólo para probar el flavour (`src/generated-wasm/`, borrado — el test de contrato por WASM
# ahora importa el paquete). Verificado en un spike previo: `ubrn build wasm2` sí acepta escribir
# fuera de este directorio sin pisar nada de esta app.
rust:
  directory: ../../rust-core
  manifestPath: crates/ffi/Cargo.toml
bindings:
  cpp: cpp/bindings
  ts: ../../packages/core-financiero-wasm/generated
