[workspace]
resolver = "2"
members = ["crates/domain", "crates/ffi"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
rust_decimal = "1.43"
chacha20poly1305 = "0.11"
hex = "0.4"
thiserror = "2.0"
# Anclado a 0.31 por uniffi-bindgen-react-native, que fija `=0.31`. Ver PENDING.md.
uniffi = "0.31"
proptest = "1.11"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"   # NO cambiar a abort: desactiva el catch_unwind de uniffi
